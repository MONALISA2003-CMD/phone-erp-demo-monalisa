name: Replace App From ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "deployment/*.zip"

permissions:
  contents: write

jobs:
  replace-app:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find latest ZIP
        id: zip
        shell: bash
        run: |
          ZIP=$(find deployment -maxdepth 1 -type f -name "*.zip" | sort -V | tail -n 1)

          if [ -z "$ZIP" ]; then
            echo "No ZIP file found in deployment/"
            exit 1
          fi

          echo "Using ZIP: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract new application
        shell: bash
        run: |
          rm -rf .new-app
          mkdir -p .new-app

          unzip -q "${{ steps.zip.outputs.zip }}" -d .new-app

          # Handle ZIPs that contain one top-level folder.
          ITEMS=$(find .new-app -mindepth 1 -maxdepth 1 | wc -l)

          if [ "$ITEMS" -eq 1 ] && [ -d "$(find .new-app -mindepth 1 -maxdepth 1 -type d)" ]; then
            INNER=$(find .new-app -mindepth 1 -maxdepth 1 -type d)
            cp -a "$INNER"/. .new-app/
            rm -rf "$INNER"
          fi

          echo "Extracted files:"
          find .new-app -maxdepth 2 -type f | head -100

      - name: Remove old application files
        shell: bash
        run: |
          # Delete everything in the repository root except:
          # - .git
          # - .github
          # - deployment
          #
          # This prevents the workflow and ZIP storage from being deleted.

          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name "deployment" \
            -exec rm -rf {} +

      - name: Install new application
        shell: bash
        run: |
          cp -a .new-app/. .

          rm -rf .new-app

          echo "New application installed."

      - name: Remove ZIP from tracked deployment files
        shell: bash
        run: |
          # Keep the ZIP available for future deployments only if desired.
          # This workflow intentionally leaves deployment/*.zip untouched.

          git status --short

      - name: Commit replacement
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Replace application with latest ZIP"
          git push
