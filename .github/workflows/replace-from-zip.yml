name: Replace App From ZIP

on:
  push:
    paths:
      - "new-app.zip"

permissions:
  contents: write

jobs:
  replace-app:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check ZIP exists
        run: |
          if [ ! -f "new-app.zip" ]; then
            echo "ERROR: new-app.zip was not found."
            exit 1
          fi

          echo "Found new-app.zip"
          ls -lh new-app.zip

      - name: Extract ZIP to temporary folder
        run: |
          rm -rf .new-app
          mkdir -p .new-app

          unzip -q new-app.zip -d .new-app

          echo "ZIP extracted successfully."

          if [ -z "$(find .new-app -mindepth 1 -print -quit)" ]; then
            echo "ERROR: ZIP is empty."
            exit 1
          fi

      - name: Handle single folder inside ZIP
        shell: bash
        run: |
          shopt -s dotglob nullglob

          items=(.new-app/*)

          if [ "${#items[@]}" -eq 1 ] && [ -d "${items[0]}" ]; then
            echo "ZIP contains one top-level folder."
            echo "Flattening it..."

            temp=".flattened-app"
            mkdir "$temp"

            cp -a "${items[0]}"/. "$temp"/

            rm -rf .new-app
            mv "$temp" .new-app
          fi

          echo "New application files:"
          find .new-app -maxdepth 3 -type f | sort

      - name: Validate new application
        shell: bash
        run: |
          if [ ! -f ".new-app/index.html" ]; then
            echo "ERROR: index.html was not found in the new ZIP."
            echo "Old application will NOT be deleted."
            exit 1
          fi

          echo "New application validation passed."

      - name: Remove old application
        shell: bash
        run: |
          echo "Removing old application files..."

          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name "new-app.zip" \
            -exec rm -rf {} +

          echo "Old application removed."

      - name: Install new application
        shell: bash
        run: |
          echo "Installing new application..."

          cp -a .new-app/. .

          rm -rf .new-app

          echo "New application installed."

      - name: Show final files
        run: |
          echo "Final repository:"
          find . -maxdepth 3 -type f \
            ! -path "./.git/*" \
            | sort

      - name: Commit new application
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Replace application with new ZIP"

          git push
