name: Deploy Application From ZIP

on:
  push:
    paths:
      - "monalisa-stock-erp-release.zip"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release ZIP
        shell: bash
        run: |
          set -e
          test -f monalisa-stock-erp-release.zip
          unzip -t monalisa-stock-erp-release.zip
          rm -rf .release
          mkdir .release
          unzip -q monalisa-stock-erp-release.zip -d .release

          test -f .release/index.html
          test -f .release/app.js
          test -f .release/styles.css

      - name: Replace old application
        shell: bash
        run: |
          set -e

          find . -mindepth 1 -maxdepth 1             ! -name ".git"             ! -name ".github"             ! -name "monalisa-stock-erp-release.zip"             -exec rm -rf {} +

          cp -a .release/. .
          rm -rf .release

      - name: Commit replacement
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Deploy application from release ZIP"
          git push
